<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Blog U-Secretary</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="/index.css?v=2">
    <link rel="stylesheet" href="/admin/admin.css?v=2">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dark-theme">

    <div id="login-screen" class="admin-container">
        <div class="glass-panel login-panel">
            <div class="brand-logo" style="justify-content: center; margin-bottom: 2rem;">
                <i class="ph ph-waveform"></i> U-Secretary <span class="brand-highlight">ADMIN</span>
            </div>
            <h2>Acesso Restrito</h2>
            <form id="login-form" onsubmit="fazerLogin(event); return false;">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="login-email" required placeholder="admin@usecretary.com.br">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Entrar</button>
            </form>
            <p id="login-error" class="error-msg" style="display: none;">Email ou senha incorretos.</p>
        </div>
    </div>

    <div id="dashboard-screen" class="admin-container" style="display: none;">
        <nav class="admin-nav">
            <div class="brand-logo">
                <i class="ph ph-waveform"></i> U-Secretary <span class="brand-highlight">ADMIN</span>
            </div>
            <button id="logout-btn" class="btn-secondary btn-sm">Sair</button>
        </nav>

        <div class="admin-layout">
            <aside class="admin-sidebar glass-panel">
                <ul>
                    <li class="active"><i class="ph ph-pencil-simple"></i> Novo Artigo</li>
                    <li><i class="ph ph-files"></i> Meus Artigos (em breve)</li>
                </ul>
            </aside>

            <main class="admin-main glass-panel">
                <h2 style="margin-bottom: 1.5rem;">Escrever Novo Artigo</h2>
                
                <form id="post-form" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label>Título do Artigo</label>
                        <input type="text" id="post-title" required placeholder="Ex: Como organizar sua rotina...">
                    </div>
                    
                    <div class="form-group">
                        <label>Resumo (Pequeno texto que aparece no card do blog)</label>
                        <textarea id="post-excerpt" rows="2" required placeholder="Ex: Aprenda 5 dicas fundamentais para..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group" style="flex: 1;">
                            <label>Categoria</label>
                            <select id="post-category" required>
                                <option value="Organização">Organização</option>
                                <option value="Produtividade">Produtividade</option>
                                <option value="Secretaria">Secretaria</option>
                                <option value="Tecnologia">Tecnologia</option>
                                <option value="Dicas">Dicas</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex: 2;">
                            <label>URL da Imagem de Capa</label>
                            <input type="url" id="post-image" required placeholder="https://exemplo.com/imagem.jpg">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Conteúdo Completo</label>
                        <textarea id="post-content" rows="12" required placeholder="Escreva seu artigo aqui..."></textarea>
                    </div>

                    <button type="submit" class="btn-primary" id="publish-btn">
                        <i class="ph ph-paper-plane-tilt"></i> Publicar Artigo
                    </button>
                    <p id="publish-status" style="margin-top: 1rem;"></p>
                </form>
            </main>
        </div>
    </div>

    <!-- Script externo do Admin (Inlined para evitar cache do Vercel) -->
    <script>
// Tratar qualquer erro global
window.onerror = function(msg, url, line) {
    alert("ERRO NO CÓDIGO:\n" + msg + "\nLinha: " + line);
};

// Configuração do Supabase
const SUPABASE_URL = 'https://croheciuxhtifejhcwws.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNyb2hlY2l1eGh0aWZlamhjd3dzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1NDYxNTgsImV4cCI6MjA4NjEyMjE1OH0.Fqt9ushsPnS6iQX7oGjeFtKfxyIK5iyVEBY5HCa5d1c';

let supabase = null;

// Verifica carregamento do Supabase
if (!window.supabase) {
    alert("ERRO CRÍTICO: O Supabase não carregou do servidor (CDN). O botão não vai funcionar. Tente abrir em outra rede ou desativar o AdBlock.");
} else {
    try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) {
        alert("Erro ao inicializar Supabase: " + e.message);
    }
}

// Elementos da UI
const loginScreen = document.getElementById('login-screen');
const dashboardScreen = document.getElementById('dashboard-screen');
const logoutBtn = document.getElementById('logout-btn');
const postForm = document.getElementById('post-form');
const publishStatus = document.getElementById('publish-status');

// Verifica se o usuário já está logado ao carregar a página
async function checkSession() {
    if (!supabase) return;
    try {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            showDashboard();
        } else {
            showLogin();
        }
    } catch (e) {
        console.error(e);
    }
}

// Fazer Login
window.fazerLogin = async function(e) {
    if (e) e.preventDefault();
    try {
        const emailInput = document.getElementById('login-email');
        const passwordInput = document.getElementById('login-password');
        const errorMsg = document.getElementById('login-error');
        const btn = document.querySelector('#login-form button');
        
        if (!supabase) {
            alert("ERRO: O banco de dados (Supabase) não está conectado. Tente recarregar a página.");
            return;
        }
        
        // Validação básica
        if (!emailInput.value || !passwordInput.value) {
            errorMsg.textContent = 'Por favor, preencha o e-mail e a senha.';
            errorMsg.style.display = 'block';
            return;
        }

        errorMsg.style.display = 'none';
        btn.textContent = 'Carregando...';
        btn.disabled = true;
        
        try {
            const { data, error } = await supabase.auth.signInWithPassword({
                email: emailInput.value,
                password: passwordInput.value,
            });

            if (error) {
                let msg = error.message;
                if (msg === 'Invalid login credentials') {
                    msg = 'E-mail ou senha incorretos.';
                }
                errorMsg.textContent = msg;
                errorMsg.style.display = 'block';
            } else {
                showDashboard();
            }
        } catch (authError) {
            errorMsg.textContent = 'Erro de conexão: ' + authError.message;
            errorMsg.style.display = 'block';
        }
        
        btn.textContent = 'Entrar';
        btn.disabled = false;
    } catch (err) {
        alert("Erro interno na tela de login: " + err.message);
    }
};

if (logoutBtn) {
    logoutBtn.addEventListener('click', async () => {
        if (!supabase) return;
        await supabase.auth.signOut();
        showLogin();
    });
}

if (postForm) {
    postForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const title = document.getElementById('post-title').value;
        const excerpt = document.getElementById('post-excerpt').value;
        const category = document.getElementById('post-category').value;
        const imageUrl = document.getElementById('post-image').value;
        const content = document.getElementById('post-content').value;
        const btn = document.getElementById('publish-btn');
        
        btn.disabled = true;
        btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Publicando...';
        publishStatus.textContent = '';
        publishStatus.className = '';

        const { data, error } = await supabase.auth.getUser();
        if (!data.user) {
            alert("Sua sessão expirou. Faça login novamente.");
            showLogin();
            return;
        }

        const { error: insertError } = await supabase
            .from('blog_posts')
            .insert([
                { 
                    title: title, 
                    excerpt: excerpt, 
                    category: category, 
                    image_url: imageUrl, 
                    content: content 
                }
            ]);

        if (insertError) {
            publishStatus.textContent = 'Erro ao publicar: ' + insertError.message;
            publishStatus.className = 'error-msg';
        } else {
            publishStatus.textContent = 'Artigo publicado com sucesso! 🎉';
            publishStatus.className = 'success-msg';
            postForm.reset();
        }
        
        btn.disabled = false;
        btn.innerHTML = '<i class="ph ph-paper-plane-tilt"></i> Publicar Artigo';
    });
}

function showLogin() {
    if(loginScreen) loginScreen.style.display = 'block';
    if(dashboardScreen) dashboardScreen.style.display = 'none';
}

function showDashboard() {
    if(loginScreen) loginScreen.style.display = 'none';
    if(dashboardScreen) dashboardScreen.style.display = 'block';
}

// Iniciar verificação
checkSession();
    </script>
</body>
</html>
